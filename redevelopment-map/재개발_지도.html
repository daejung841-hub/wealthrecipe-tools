<script>
(function() {
 var H = document.documentElement, GO = "../index.html";
 H.classList.add("gate-pending");
 var st = document.createElement("style");
 st.textContent = "html.gate-pending body > *:not(#gateFail){display:none!important;}#gateFail{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#fff;color:#182430;font:16px/1.5 sans-serif;}#gateFail button{height:44px;padding:0 22px;border:0;border-radius:10px;background:#1E3A8A;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}";
 document.head.appendChild(st);
 var ready = function() {
  return typeof requireSiteAuth === "function" && typeof isSiteAuthed === "function" && typeof SITE_PASSWORD !== "undefined";
 };
 var run = function() {
  requireSiteAuth(GO);
  if (isSiteAuthed()) {
   H.classList.remove("gate-pending");
   try {
    window.dispatchEvent(new Event("resize"));
   } catch (e) {}
  }
 };
 var fail = function() {
  var mk = function() {
   if (document.getElementById("gateFail")) return;
   var d = document.createElement("div");
   d.id = "gateFail";
   d.setAttribute("role", "alert");
   d.innerHTML = '<div>잠금 확인 파일을 불러오지 못했어요.<br>잠시 뒤 다시 불러와 주세요.</div><button type="button" id="gateRetry">다시 불러오기</button>';
   document.body.appendChild(d);
   document.getElementById("gateRetry").addEventListener("click", (function() {
    location.reload();
   }));
  };
  if (document.body) mk(); else document.addEventListener("DOMContentLoaded", mk);
 };
 if (ready()) {
  run();
  return;
 }
 var tries = 0, need = function() {
  return typeof SITE_PASSWORD === "undefined" ? "../config.js" : "../gate.js";
 };
 (function retry() {
  if (ready()) {
   run();
   return;
  }
  if (tries >= 3) {
   fail();
   return;
  }
  tries++;
  var sc = document.createElement("script");
  sc.src = need() + "?r=" + Date.now() + tries;
  sc.onload = function() {
   retry();
  };
  sc.onerror = function() {
   setTimeout(retry, 700);
  };
  document.head.appendChild(sc);
 })();
})();
</script>
