<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재개발 구역 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">   <!-- 8차: 지도 화면 글꼴 Pretendard v1.3.9 -->
<script src="../config.js"></script>
<script src="../gate.js"></script>
<script src="../feedback-widget.js" data-calculator="redevelopment-list"></script>   <!-- 16차 덧붙임 3·4: 공용 의견 보내기(목록표와 같은 항목으로 받음) -->
<script>
(function(){
  var H = document.documentElement, GO = '../index.html';
  H.classList.add('gate-pending');   // 잠금 확인이 끝나기 전에는 지도 내용을 보여 주지 않음
  var st = document.createElement('style');
  st.textContent = 'html.gate-pending body > *:not(#gateFail){display:none!important;}#gateFail{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#fff;color:#182430;font:16px/1.5 sans-serif;}#gateFail button{height:44px;padding:0 22px;border:0;border-radius:10px;background:#1E3A8A;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;}';
  document.head.appendChild(st);
  var ready = function(){ return typeof requireSiteAuth === 'function' && typeof isSiteAuthed === 'function' && typeof SITE_PASSWORD !== 'undefined'; };
  var run = function(){ requireSiteAuth(GO); if (isSiteAuthed()) { H.classList.remove('gate-pending'); try { window.dispatchEvent(new Event('resize')); } catch (e) {} } };   // 인증이 안 됐으면 requireSiteAuth가 첫 화면으로 보냄(그동안 내용은 계속 숨김). 보여 줄 때 지도 크기 다시 맞춤
  var fail = function(){
    var mk = function(){ if (document.getElementById('gateFail')) return; var d = document.createElement('div'); d.id = 'gateFail'; d.setAttribute('role', 'alert');
      d.innerHTML = '<div>잠금 확인 파일을 불러오지 못했어요.<br>잠시 뒤 다시 불러와 주세요.</div><button type="button" id="gateRetry">다시 불러오기</button>'; document.body.appendChild(d);
      document.getElementById('gateRetry').addEventListener('click', function(){ location.reload(); }); };
    if (document.body) mk(); else document.addEventListener('DOMContentLoaded', mk);
  };
  if (ready()) { run(); return; }
  var tries = 0, need = function(){ return typeof SITE_PASSWORD === 'undefined' ? '../config.js' : '../gate.js'; };
  (function retry(){
    if (ready()) { run(); return; }
    if (tries >= 3) { fail(); return; }
    tries++; var sc = document.createElement('script'); sc.src = need() + '?r=' + Date.now() + tries;
    sc.onload = function(){ retry(); }; sc.onerror = function(){ setTimeout(retry, 700); };
    document.head.appendChild(sc);
  })();
})();
</script>
<style>
  :root{
    --navy:#1E3A8A; --navy-soft:#EEF2FF; --navy-line:#C7D2FE;
    --ink:#1F2937; --ink-sub:#4B5563; --ink-faint:#6B7280; --line:#E5E7EB; --bg:#FFFFFF; --bg-soft:#F5F6F8;
    --cx:#0F766E; --cx-soft:#F0FDFA;
    --hdr:52px; --panel:640px;   /* 6차: 비교 단지 5곳이 가로 스크롤 없이 보이는 넓이를 재서 정함(600 미만이면 거리 글자가 잘림) */
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* 숨김 표시가 display 규칙에 덮이지 않게(거리뷰 '불러오는 중' 글자가 사진 위에 남던 문제) */
  html,body{margin:0;height:100%;overflow:hidden}   /* 페이지 스크롤 없음 — 화면 한 장에 고정, 패널 안에서만 스크롤 */
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;display:flex;flex-direction:column;height:100vh;height:100dvh}
  button,input,select,textarea{font-family:inherit}
  header{height:var(--hdr);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:1300}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px;color:var(--navy)}
  header .count{font-size:13px;color:var(--ink-sub)}
  header .count b{color:var(--ink)}
  /* 14차: 큰 '지도 | 목록표' 전환(두 칸 토글) — 목록표 맨 위 버튼과 같은 글자·색·크기·위치 */
  /* 15차: 머리줄 안 가운데 — PC 가로 280·세로 40·글자 15, 휴대폰 가로 200·세로 40·글자 14 (새 줄 없음) */
  .vsw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1310}
  .vsw-in{display:flex;width:280px;height:40px;border:1px solid var(--navy);border-radius:10px;overflow:hidden;background:#fff}
  .vsw-b{flex:1 1 0;display:flex;align-items:center;justify-content:center;min-height:40px;font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--navy);text-decoration:none;background:#fff;cursor:pointer}
  .vsw-b.on{background:var(--navy);color:#fff;cursor:default}
  .barlg{position:absolute;left:12px;bottom:44px;z-index:30;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink)}
  .barlg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
  .barlg span{color:var(--ink-faint)}
  .bld{font-size:13px;font-weight:700;color:var(--navy);padding:2px 0}
  .tsum{font-size:13px;line-height:1.55;margin:4px 0 6px;padding:7px 10px;border:1px solid var(--navy-line);background:var(--navy-soft);border-radius:8px;color:var(--ink)}
  .tsum b{color:var(--navy)}
  /* 16차 덧붙임 3·4: 오른쪽 위 '의견 보내기'(전환 버튼과 같은 높이 40) · 지도 안 왼쪽 위 검색창 */
  .fw-fab{display:none!important}
  .fbk{position:absolute;right:16px;top:50%;transform:translateY(-50%);height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;z-index:1310}
  .fbk .s{display:none}
  .fbk:focus-visible{outline:3px solid #93C5FD;outline-offset:2px}
  .main .sbox{position:absolute;left:14px;top:14px;right:auto;width:420px;z-index:950}
  .main .sbox .search{border:2px solid var(--navy);box-shadow:0 2px 10px rgba(0,0,0,.18);padding:0 6px 0 16px}
  .main .sbox .search input{font-size:16px;padding:11px 0}
  .main .sbox .search button{font-size:14px;padding:7px 14px}
  .vsw-b:not(.on):hover{background:var(--navy-soft)}
  .vsw-b:focus-visible{outline:3px solid #93C5FD;outline-offset:-3px}
  /* 16차 덧붙임 16-8: 오른쪽 위(의견 보내기 아래 흰 여백) 목록표 바로가기 버튼 3개 — 작은 네이비 테두리, 한 줄. 휴대폰은 머리줄 왼쪽 접는 메뉴 하나 */
  .qlinks{position:absolute;right:16px;top:8px;display:flex;gap:6px;z-index:2}
  .qlinks a,.qmp a{display:inline-flex;align-items:center;height:30px;padding:0 12px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;letter-spacing:-.2px;text-decoration:none;white-space:nowrap}
  .qlinks a:hover,.qmp a:hover{background:var(--navy-soft)}
  .qlinks a:focus-visible,.qmb:focus-visible,.qmp a:focus-visible{outline:3px solid #93C5FD;outline-offset:1px}
  .qm{display:none}
  /* 지도 마무리(1103c): 바로가기 3개 팝업(안은 목록표 팝업 모드). 닫아도 지우지 않으려고 숨김은 visibility로(미리 불러 둔 화면이 제 크기로 그려지게) */
  .qpop{position:fixed;inset:0;z-index:3000;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .qpop.off{visibility:hidden;pointer-events:none}
  .qpop .qbox{position:relative;width:min(1180px,100%);height:min(88vh,900px);background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.32);display:flex;flex-direction:column;overflow:hidden}
  .qpop .qhd{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:50px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
  .qpop .qhd b{font-size:16px;font-weight:800;color:var(--navy);margin-right:auto;white-space:nowrap}
  .qpop .qfull{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
  .qpop .qfull:hover{background:var(--navy-soft)}
  .qpop .qx{width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:var(--ink-sub);font-size:20px;line-height:1;cursor:pointer}
  .qpop .qx:hover{background:var(--bg-soft)}
  .qpop .qfull:focus-visible,.qpop .qx:focus-visible{outline:3px solid #93C5FD;outline-offset:1px}
  .qpop .qbody{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#fff}
  .qpop .qbody iframe{position:absolute;left:0;top:-44px;width:100%;height:calc(100% + 44px);border:0;background:#fff}   /* 목록표 팝업 모드 맨 위 44px 줄(제목·전체 보기)은 이 팝업 머리와 겹쳐 가림 */
  .qpop .qload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink-faint);font-size:14px;z-index:2}
  .qpop .qload[hidden]{display:none}
  @media (max-width:767px){ .qpop{padding:0;align-items:stretch} .qpop .qbox{width:100%;height:100%;border-radius:0} }
  @media (min-width:768px){ .fbar{padding-right:330px} }
  @media (max-width:767px){
    .qlinks{display:none}
    .qm{display:block;position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:1320}
    .qmb{height:34px;padding:0 9px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
    .qmp{position:absolute;left:0;top:40px;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:140px}
    .qmp[hidden]{display:none}
    .qmp a{height:38px;font-size:14px}
  }
  /* 위쪽 필터 두 줄 + 검색 */
  .fbar{flex:0 0 auto;position:relative;z-index:1250;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
  .frow{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .frow::-webkit-scrollbar{display:none}
  .frow .lb{flex:0 0 auto;font-size:12px;color:var(--ink-faint);width:58px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;line-height:1.25;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-.5px;border:1.5px solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
  .sbox{position:absolute;right:16px;top:8px;width:320px;z-index:1260}
  .search{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 5px 0 13px}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;padding:7px 0;min-width:0;background:transparent}
  .search button{border:0;background:var(--navy);color:#fff;border-radius:999px;font-size:12.5px;font-weight:700;padding:5px 11px;cursor:pointer}
  .sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:min(60vh,460px);overflow:auto;display:none}
  .sres.on{display:block}
  .sres .gh{position:sticky;top:0;background:var(--bg-soft);font-size:11.5px;color:var(--ink-faint);padding:5px 12px;font-weight:700}
  .sres .it{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-top:1px solid #F3F4F6}
  .sres .it:hover,.sres .it.act{background:var(--navy-soft)}
  .sres .it .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .sres .it .nm{font-size:14px;font-weight:700}
  .sres .it .sub{font-size:12px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
  .sres .none{padding:12px;font-size:13px;color:var(--ink-faint)}
  /* 지도 */
  .main{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  .mapbox{position:absolute;inset:0}   /* 네이버가 #map 에 position:relative 를 넣으므로 바깥 상자로 자리를 잡음 */
  #map{width:100%;height:100%;--r:5px}
  .tools{position:absolute;z-index:900;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
  .tb{width:60px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:11.5px;line-height:1.25;padding:6px 2px;cursor:pointer;color:var(--ink-sub);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .tb[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);font-weight:800;background:var(--navy-soft)}
  .basis{position:absolute;left:12px;bottom:30px;z-index:900;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--ink-sub);padding:2px 8px;pointer-events:none}
  .lgbar{position:absolute;left:auto;right:84px;bottom:12px;max-width:calc(100% - 200px);z-index:880;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-end;gap:6px;pointer-events:none}   /* 13차: 오른쪽 아래(출처 버튼 왼쪽) */
  .lgtog{display:none;pointer-events:auto;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11.5px;padding:4px 10px;cursor:pointer;color:var(--ink-sub);white-space:nowrap}
  .lg2{pointer-events:auto;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px 12px;font-size:11px;color:var(--ink-sub);box-shadow:0 1px 4px rgba(0,0,0,.08);max-width:100%}
  .lg2 > div{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .lg2 i{display:inline-block;width:9px;height:9px;border-radius:50%}
  .lg2 .poly{display:inline-block;width:16px;height:0;border-top:2px solid #7048E8}
  .lg2 .poly.cand{border-top-style:dotted}
  .lg2 .bbl{font-size:10px;font-weight:700;background:#0F766E;color:#fff;border-radius:6px;padding:0 4px}
  .lg2 .note{display:none}
  @media (max-width:767px){ .lgtog{display:inline-block} .lgbar.fold .lg2{display:none} .lgbar{right:12px;bottom:54px} .lg2{flex-wrap:nowrap;overflow-x:auto} }
  .srcbtn{position:absolute;right:12px;bottom:14px;z-index:900;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;padding:5px 10px;cursor:pointer;color:var(--ink-sub);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .srcpop{position:absolute;right:12px;bottom:50px;z-index:1050;width:min(400px,calc(100% - 24px));max-height:70%;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:12px 14px;font-size:12.5px;line-height:1.6;display:none}
  .srcpop.on{display:block}
  .srcpop h3{font-size:13.5px;margin:0 0 6px;display:flex;align-items:center}
  .srcpop h3 button{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink-faint)}
  .srcpop details{margin:2px 0 8px}
  .srcpop summary{cursor:pointer;font-weight:700;font-size:12.5px}
  .srcpop ul{margin:0;padding-left:16px}
  .lg div{line-height:1.75}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1.5px solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.3)}
  .lg i.hollow{background:#fff!important;border:2.5px solid var(--ink-sub);box-shadow:none}
  .lg .poly{display:inline-block;width:16px;height:10px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink-sub);background:rgba(107,114,128,.15);border-radius:2px}
  .lg .sub{border:1px solid #7048E8;background:transparent}
  .lg .cand{border:2px dashed #7048E8;background:rgba(112,72,232,.08)}
  .lg .bbl{display:inline-block;font-size:10px;line-height:14px;padding:0 4px;border-radius:4px;margin-right:6px;background:#fff;border:1px solid #9CA3AF;color:#374151;font-weight:700;vertical-align:1px}
  .lg .bbl.hi{background:var(--cx);border-color:var(--cx);color:#fff}
  .empty{position:absolute;z-index:900;left:50%;top:45%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;display:none}
  /* 구역 점·이름표 — 작고 단정하게(유형 색) */
  .pt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:calc(var(--r) * 2);height:calc(var(--r) * 2);border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.28);cursor:pointer}
  .pt.hollow{background:#fff!important;border:2.5px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .pt.multi{box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--c),0 1px 4px rgba(0,0,0,.3)}
  .pt.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}
  .zl{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 8px));white-space:nowrap;background:rgba(255,255,255,.94);border:1.5px solid var(--c);font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--c);pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.1);letter-spacing:-.2px}
  .zl.c{transform:translate(-50%,-50%)}
  .zl.sd{transform:translate(10px,-50%)}   /* 16차 덧붙임 7: 작은 구역은 안쪽 점 + 이름 옆 */
  .zdot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c,#7048E8);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
  .sz.f.sd{transform:translate(9px,-50%)!important}

  .zl.twA{font-size:13px;border-width:2px;box-shadow:0 1px 4px rgba(0,0,0,.25)}   /* 16차: 타운 이름표 '가' — 조금 진하게 */
  .zl.twA .l1{font-weight:900}
  .zl.tw{pointer-events:auto;cursor:pointer}   /* 12차: 모아타운 이름표는 눌러서 타운 전체 */
  .sz.f{pointer-events:auto;cursor:pointer}
  .zl{border-radius:9px!important;text-align:center;line-height:1.2;padding:2px 8px 3px!important}
  .zl .l1,.zl .l2{display:block}
  .zl .l2{font-size:9.5px;font-weight:600;opacity:.8;letter-spacing:-.1px}   /* 7차: 아랫줄 진행 단계(목록표 단계 이름) */

  const COMPLEX_JS = '지도_단지.js';
  const LIST_ONLY = LIST_PAGE + '?' + encodeURIComponent('보기') + '=' + encodeURIComponent('목록');   // 14차: 목록표 쪽이 '?보기=목록'이면 지도 기본 화면으로 되돌리지 않음
  document.getElementById('listLink').href = LIST_ONLY;
  // 16차 덧붙임 16-8: 목록표 바로가기(A탭 주소 ?보기=목록&열기=명예의전당|진행속도|주목구역)
  document.querySelectorAll('[data-open]').forEach(a => { a.href = LIST_ONLY + '&' + encodeURIComponent('열기') + '=' + encodeURIComponent(a.dataset.open); });
  // 지도 마무리(1103c): 누르면 지도 위 팝업(안은 목록표 팝업 모드 ?열기=…&모드=팝업). 새 탭으로 열기(Ctrl·가운데 단추)는 링크 그대로 목록표
  const QP = {el: document.getElementById('qpop'), body: document.getElementById('qpopB'), load: document.getElementById('qpopL'), fr: {}, cur: null, back: null, pre: false};
  const QNAME = {'명예의전당': '명예의 전당', '진행속도': '진행 속도', '주목구역': '주목 구역'};
  const QSEL = {'명예의전당': '#dmpBtnFame', '진행속도': '#dmpBtnSpeed', '주목구역': '[data-rt-attn]'};   // 목록표 안 여는 단추(닫힌 화면 되살릴 때)
  const qUrl = (op) => LIST_PAGE + '?' + encodeURIComponent('열기') + '=' + encodeURIComponent(op) + '&' + encodeURIComponent('모드') + '=' + encodeURIComponent('팝업');
  function qShown(op){   // 목록표 안 그 화면이 열려 있는지
    try { const d = QP.fr[op].contentDocument, e = d.getElementById(op === '주목구역' ? 'rtAttn' : 'dmpOverlay'); return !!e && !e.hidden; } catch (e) { return true; }
  }
  function qRestore(op){ try { if (qShown(op)) return; const b = QP.fr[op].contentDocument.querySelector(QSEL[op]); if (b) b.click(); } catch (e) {} }
  function qFrame(op, then){
    let f = QP.fr[op]; if (f) { if (then) { if (f.__ok) then(); else f.__then = then; } return f; }
    f = QP.fr[op] = document.createElement('iframe'); f.title = QNAME[op] + ' (목록표)'; f.style.visibility = 'hidden'; f.__then = then;
    f.addEventListener('load', () => {
      f.__ok = true;
      if (QP.cur === op) { f.style.visibility = ''; QP.load.hidden = true; }
      try {   // 목록표 안에서 Esc: 안쪽 작은 창이 닫힌 것이면 그대로, 아니면 이 팝업을 닫음(목록표 화면이 같이 닫혔으면 다음에 열 때를 위해 되살림)
        const w = f.contentWindow; let mark = 0;
        w.addEventListener('keydown', (e) => { if (e.key === 'Escape') mark = w.document.querySelectorAll('[hidden]').length; }, true);
        w.addEventListener('keydown', (e) => { if (e.key !== 'Escape' || QP.cur !== op) return; setTimeout(() => {
          const gone = !qShown(op), same = w.document.querySelectorAll('[hidden]').length === mark;
          if (gone || same) { qClose(); if (gone) qRestore(op); }
        }, 0); }, true);   // 28차 덧붙임 23: 목록표가 Esc를 막아도(포커스가 팝업 안일 때) 이 팝업이 닫히게 — 잡기 단계에서 받음
        w.document.addEventListener('click', () => setTimeout(() => { if (QP.cur === op && !qShown(op)) { qClose(); qRestore(op); } }, 0));   // 목록표 안 바깥 클릭으로 그 화면이 닫히면 이 팝업도 닫음
      } catch (e) {}
      const t = f.__then; f.__then = null; if (t) t();
    }, {once: true});
    f.src = qUrl(op); QP.body.appendChild(f); return f;
  }
  function qOpen(op, from){
    qPriority(op);   // 20차 4번(키보드 Enter처럼 누름 없이 열 때도)
    const f = qFrame(op); QP.cur = op; QP.back = from || null;
    Object.keys(QP.fr).forEach(k => { const x = QP.fr[k]; x.style.visibility = (k === op && x.__ok) ? '' : 'hidden'; x.style.zIndex = k === op ? '1' : '0'; });
    if (f.__ok) qRestore(op);
    document.getElementById('qpopT').textContent = QNAME[op];
    document.getElementById('qpopFull').href = LIST_ONLY + '&' + encodeURIComponent('열기') + '=' + encodeURIComponent(op);
    QP.load.hidden = !!f.__ok; QP.el.classList.remove('off'); QP.el.setAttribute('aria-hidden', 'false');
    document.getElementById('qpopX').focus();

  }

    if (done) QP.done = done;
    if (QP.pre) return; QP.pre = true; QP.q = Object.keys(QNAME).filter(op => !QP.fr[op]); qPump();   // 28차 덧붙임 23: 1103e처럼 셋 다 미리 불러 둠(A탭이 팝업 모드를 가볍게 고침)   // 27차 속도: 미리 불러 두기는 첫 화면(명예의 전당) 하나만 — 목록표 팝업 화면이 무거워져(노드 4.8만 개) 셋을 다 부르면 크롬 메모리 2GB 넘음. 나머지는 바로가기에 마우스가 올라가거나 누를 때 부름
  }
  // 20차 4번: 차례 받기 — 누른 화면을 기다리는 동안(QP.pri)은 다음 것을 시작하지 않음, 끝나면 이어 감
  function qPump(){
    if (QP.pri || QP.busy) return;
    while (QP.q.length && QP.fr[QP.q[0]] && QP.fr[QP.q[0]].__ok) QP.q.shift();
    if (!QP.q.length) { const d = QP.done; QP.done = null; if (d) d(); return; }
    const op = QP.q.shift(); QP.busy = op;
    qFrame(op, () => { if (QP.busy === op) QP.busy = null; setTimeout(qPump, 100); });

  // 20차 4번: 누른 화면을 맨 앞으로 — 받는 중인 다른 미리 불러 두기(팝업·계산기)를 잠시 멈추고, 누른 화면이 다 뜨면 다시 이어 감
  function qPriority(op){

  document.querySelectorAll('[data-open]').forEach(a => a.addEventListener('pointerenter', () => qFrame(a.dataset.open), {passive: true}));
  document.querySelectorAll('[data-open]').forEach(a => ['pointerdown', 'touchstart'].forEach(ev => a.addEventListener(ev, () => qPriority(a.dataset.open), {passive: true})));   // 20차 4번: 누르는 순간 맨 앞으로
  document.querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;

    if (!t) { sres.classList.remove('on'); sres.innerHTML = ''; sItems = []; return; }
    const zs = ALL.filter(o => (get(o.z, 'h') || '').includes(t) || norm(get(o.z, 'n')).includes(t)).sort((a, b) => get(a.z, 'n').localeCompare(get(b.z, 'n'), 'ko'));
    const cs = CXD ? CXD.cx.map((c, i) => [c, i]).filter(([c]) => norm(cxv(c, 'name')).includes(t) || norm(cxv(c, 'id')).includes(t)).slice(0, 20) : [];
    sItems = []; let h = '';
    h += `<div class="gh">구역 ${zs.length}곳</div>`;
    if (!zs.length) h += '<div class="none">맞는 구역이 없어요.</div>';
    zs.slice(0, 40).forEach(o => { sItems.push({k: get(o.z, 'k')}); h += `<div class="it" data-n="${sItems.length - 1}"><span class="d" style="background:${colorOf(o.z)}"></span><span class="nm">${esc(get(o.z, 'n'))}</span><span class="sub">${esc(KNAME[kindOf(o.z)])} · ${esc(STAGES[get(o.z, 'sg')])}</span></div>`; });
    if (zs.length > 40) h += `<div class="none">${zs.length - 40}곳 더 있어요. 더 자세히 쳐 보세요.</div>`;
    h += `<div class="gh">단지 ${cs.length}${cs.length >= 20 ? '+' : ''}곳</div>`;
    if (!CXD) h += '<div class="none">단지 자료를 불러오는 중이에요.</div>'; else if (!cs.length) h += '<div class="none">맞는 단지가 없어요.</div>';
    cs.forEach(([c, i]) => { sItems.push({cx: i}); h += `<div class="it" data-n="${sItems.length - 1}"><span class="d" style="background:#0F766E"></span><span class="nm">${esc(cxv(c, 'name'))}</span><span class="sub">${p34(c) ? eok(p34(c)) : '단지'}</span></div>`; });
    sres.innerHTML = h; sres.classList.add('on'); sAct = -1;
  }
  function pick(n){
    const it = sItems[n]; if (!it) return;
    sres.classList.remove('on'); q.blur();
    if (it.k) goZone(it.k, 'search');
    else { const c = CXD.cx[it.cx]; openComplex(it.cx); centerOn(cxv(c, 'lat'), cxv(c, 'lng')); }   // 9차: 검색으로 고른 단지도 확대 단계는 그대로
  }
  q.addEventListener('input', searchList);
  q.addEventListener('focus', () => { if (q.value) searchList(); });
  q.addEventListener('keydown', (e) => {
    if (!sres.classList.contains('on')) return;
    const its = sres.querySelectorAll('.it');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sAct = Math.max(0, Math.min(its.length - 1, sAct + (e.key === 'ArrowDown' ? 1 : -1))); its.forEach((x, j) => x.classList.toggle('act', j === sAct)); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(sAct >= 0 ? +its[sAct].dataset.n : 0); }
    else if (e.key === 'Escape') sres.classList.remove('on');
  });
  sres.addEventListener('mousedown', (e) => { const it = e.target.closest('.it'); if (it) { e.preventDefault(); pick(+it.dataset.n); } });
  document.getElementById('qgo').addEventListener('click', () => { searchList(); if (sItems.length) pick(0); });
  document.addEventListener('click', (e) => { if (!e.target.closest('#sbox')) sres.classList.remove('on'); });

  // ---------- 오른쪽 버튼·범례·출처 ----------
  let lt = null;
  function refresh(){ draw(); drawCx(); if (panelMode === 'list') renderList(); }
  document.getElementById('tbCx').addEventListener('click', (e) => { st.cx = !st.cx; e.currentTarget.setAttribute('aria-pressed', st.cx); if (!st.cx) document.getElementById('cxcard').classList.remove('on'); drawCx(); });
  // 12차: 지적도(네이버 공식 지적편집도 층 CadastralLayer) 켜고 끄기 — 확대 단계가 낮으면 '확대하면 보여요' 안내(공식 문서: 지적편집도는 확대 단계 높을 때만 그려짐)
  const CAD_MINZ = 16;
  let cadLayer = null;
  function cadSync(){
    const btn = document.getElementById('tbCad'), on = btn.getAttribute('aria-pressed') === 'true', hint = document.getElementById('cadhint');
    if (!map) return;
    if (on) { if (!cadLayer) cadLayer = new NV.CadastralLayer(); cadLayer.setMap(map); } else if (cadLayer) cadLayer.setMap(null);
    hint.hidden = !(on && zoom() < CAD_MINZ);
  }
  document.getElementById('lgtog').addEventListener('click', (e) => { const b = document.getElementById('lgbar'); b.classList.toggle('fold'); e.currentTarget.setAttribute('aria-expanded', !b.classList.contains('fold')); e.currentTarget.textContent = b.classList.contains('fold') ? '범례 ▸' : '범례 ▾'; });
  if (matchMedia('(max-width:767px)').matches) document.getElementById('lgbar').classList.add('fold');   // 휴대폰은 접은 채 시작
  // 16차 10번(선택): '생활권 단절선' 켜고 끄기 — 처음 누를 때만 자료(지도_단절선_16.js)를 불러옴. 서울만, 참고 그림(선택·클릭 없음)
  const BAR_COL = {'하천': '#1C7ED6', '철도': '#495057', '큰길': '#F08C00', '녹지': '#2F9E44'};
  let barPolys = null;
  async function barSync(){
    const on = document.getElementById('tbBar').getAttribute('aria-pressed') === 'true';
    if (!map) return;
    if (on && !barPolys) {
      if (!window.MAP_BARRIER) await loadScript('지도_생활권경계.js');
      const B = window.MAP_BARRIER; if (!B) return;
      barPolys = B.f.map((f) => { const paths = f.c[0].map((ring) => { const out = []; let x = 0, y = 0; for (let i = 0; i < ring.length; i += 2) { x += ring[i]; y += ring[i + 1]; out.push(LL(y / B.scale, x / B.scale)); } return out; });
        const c = BAR_COL[f.t] || '#868E96'; return new NV.Polygon({paths, clickable: false, zIndex: 0, strokeColor: c, strokeWeight: 1, strokeOpacity: .8, fillColor: c, fillOpacity: f.t === '녹지' ? .12 : .3}); });
    }
    if (barPolys) barPolys.forEach((p) => p.setMap(on ? map : null));
    document.getElementById('barlg').hidden = !on;
  }
  document.getElementById('fbk').addEventListener('click', () => { const b = document.getElementById('fwFabBtn'); if (b) b.click(); });
  document.getElementById('tbBar').addEventListener('click', (e) => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); barSync(); });
  document.getElementById('tbCad').addEventListener('click', (e) => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); cadSync(); });
  document.getElementById('tbList').addEventListener('click', () => { if (panelMode === 'list') closePanel(); else renderList(); });
  const srcpop = document.getElementById('srcpop');
  document.getElementById('srcbtn').addEventListener('click', () => srcpop.classList.toggle('on'));
  document.getElementById('srcx').addEventListener('click', () => srcpop.classList.remove('on'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (document.getElementById('locv').classList.contains('on')) closeLoc(); else if (sv.classList.contains('on')) closeSv(); else if (document.getElementById('cxcard').classList.contains('on')) document.getElementById('cxcard').classList.remove('on'); else if (srcpop.classList.contains('on')) srcpop.classList.remove('on'); else if (cpanel.classList.contains('on')) closeCalc(); else if (panel.classList.contains('on')) closePanel(); } });
  function sources(){
    const li = [];
    if (BND) Object.values(BND.src).forEach(s => li.push(`구역 테두리: ${esc(s)} — 모양을 바꾸지 않고 지도 좌표 형식만 바꿔 표시했어요.`));
    if (SUBZ) Object.values(SUBZ.src).forEach(s => li.push(`모아 세부구역: ${esc(s)}`));
    if (CAND) Object.values(CAND.src).forEach(s => li.push(`후보지 선정 당시 범위(참고): ${esc(s)}`));
    li.push('배경지도·거리뷰: 네이버 지도(NAVER Corp.)');
    li.push('단지 위치·시세(34평 기준): 부의 레시피 저평가 계산기·시세보정 단지 자료' + (CXD && CXD.month ? ` · ${monthTxt()} 기준` : ''));
    li.push('비교 단지 선정·구역 정보·상세: 부의 레시피 재개발 목록표');
    li.push('가까운 역·도보 시간: 지도 데이터 © OpenStreetMap contributors · 경로 계산 FOSSGIS');
    li.push(`대표 위치(좌표)를 확인하지 못한 구역 ${(Z.nc || []).length}곳은 지도에 없고 목록표에서 볼 수 있어요.`);
    document.getElementById('srcList').innerHTML = li.map(x => `<li>${x}</li>`).join('');
  }
  sources(); legend();

  // ---------- 시작 ----------
  function openFromHash(){
    try { const k = zoneParam(); if (!k || !BYKEY.has(k)) return false; goZone(k, 'hash'); return true; } catch (e) { return false; }
  }
  function zoneParam(){   // 21차 7번: #zone= 이 안 먹는 곳(메신저 등이 # 뒤를 자를 때)을 위해 검색어 ?zone= 도 읽음 — #zone= 이 먼저
    try { return new URLSearchParams(String(location.hash || '').replace(/^#/, '')).get('zone') || new URLSearchParams(location.search).get('zone'); } catch (e) { return null; }
  }
  let lastMode = null;
  function initMap(){
    NV = naver.maps; try { sessionStorage.removeItem('mapToList'); } catch (e) {}
    map = new NV.Map(mapEl, {
      center: LL(37.56, 126.99), zoom: 11, minZoom: 8, maxZoom: 19,
      zoomControl: true, zoomControlOptions: {position: NV.Position.RIGHT_CENTER, style: NV.ZoomControlStyle.SMALL},
      scaleControl: false, mapDataControl: false,
    });
    
    setRadiusVar(); placeSearch();
    NV.Event.addListener(map, 'zoom_changed', () => { setRadiusVar(); if (document.getElementById('tbCad').getAttribute('aria-pressed') === 'true') cadSync(); });
    NV.Event.addListener(map, 'idle', () => {
      clearTimeout(lt);
      lt = setTimeout(() => {
        const zm = zoom(), mode = (zm >= POLY_ZOOM) + ':' + (zm >= LABEL_ZOOM) + ':' + (zm >= SUB_LABEL_ZOOM);
        // 7차: 화면 안만 그리므로 테두리 보이는 확대에서는 움직일 때마다 다시 그림
        if (mode !== lastMode || zm >= POLY_ZOOM) { lastMode = mode; draw();  }
        drawCx(); if (panelMode === 'list') renderList();
      }, 60);   // 7차: 멈춘 뒤 다시 그리기까지 기다림 100→60ms
    });
    NV.Event.addListener(map, 'click', (e) => {
      if (Date.now() - overlayClickAt < 400) return;   // 점·면·말풍선을 누른 클릭은 지도 클릭으로 치지 않음
      if (st.sv && e && e.coord) { svAt(e.coord.lat(), e.coord.lng()); return; }
      document.getElementById('cxcard').classList.remove('on'); sres.classList.remove('on');
    });
    draw();
    
    lastMode = (zoom() >= POLY_ZOOM) + ':' + (zoom() >= LABEL_ZOOM) + ':' + (zoom() >= SUB_LABEL_ZOOM);
    window.addEventListener('hashchange', openFromHash);
    const later = () => { loadBounds(); loadComplex(); };
    if (window.requestIdleCallback) requestIdleCallback(later, {timeout: 300}); else setTimeout(later, 50);
    // 16차 14번: 처음 화면 — 주소에 #zone= 이 없으면 서울 전체가 대략 꽉 차게(서울 경계 상자, PC·휴대폰 화면 크기에 맞춰 네이버가 확대 단계를 고름)
    if (!zoneParam()) {   // 16차 14번 b: 서울 경계 상자 대신 서울 구역 점들이 든 범위에 맞춤(PC 1920은 확대 12, 휴대폰은 10)
      let s0 = 90, w0 = 180, n0 = -90, e0 = -180; const isd = Z.f.indexOf('sd');
      Z.pts.forEach(([y, x, zs]) => { if (!zs.some(z => z[isd] === '서울')) return; if (y < s0) s0 = y; if (y > n0) n0 = y; if (x < w0) w0 = x; if (x > e0) e0 = x; });
      if (n0 > s0) { map.fitBounds(new NV.LatLngBounds(LL(s0, w0), LL(n0, e0)), {top: 12, right: 12, bottom: 12, left: 12}); map.setZoom(zoom() + 1); }   // 16차 덧붙임 5: 한 단계 더 크게(PC 13·휴대폰 11)
    }
    if (zoneParam()) { openFromHash(); const t = setInterval(() => { if (BND) { clearInterval(t); openFromHash(); } }, 100); }
  }
  placeSearch(); mq.addEventListener('change', placeSearch);
  loadNaver();
})();
</script>
</body>
